<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wholesale | Northside Roasters</title>
        <link rel="stylesheet" href="/legacy.css" />
    </head>
    <body>
        <main>
            <h1>Open a wholesale account</h1>
            <p class="lead">Cafés, bakeries and offices get roaster prices, weekly delivery and a free grinder check every spring.</p>
            <div id="app"></div>
        </main>
        <footer class="site-footer">
            <p>Get one email a month with new arrivals.</p>
            <form class="newsletter" onsubmit="return false">
                <input class="p-inputtext" type="email" placeholder="you@example.com" />
                <button class="p-button" type="submit">Subscribe</button>
            </form>
        </footer>
        <script type="module" src="/src/main.js"></script>
